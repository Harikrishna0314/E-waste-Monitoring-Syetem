version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ewaste_backend
    environment:
      FLASK_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/../uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ewaste_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
