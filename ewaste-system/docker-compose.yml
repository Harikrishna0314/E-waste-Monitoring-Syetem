services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: circulai_backend
    environment:
      FLASK_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: 5000
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/app/yolo11n.pt}
    volumes:
      - ./uploads:/uploads
      - ./ai/models:/ai/models:ro
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: circulai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
