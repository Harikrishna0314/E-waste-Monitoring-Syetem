name: Build and syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ewaste-system/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ewaste-system/frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: ewaste-system/frontend
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend modules
        working-directory: ewaste-system
        run: python -m py_compile backend/app.py backend/ai_service.py backend/config.py
